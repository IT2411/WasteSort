[tool.poetry]
name = "wastesort-ml"
version = "0.1.0"
description = "Machine learning training, calibration, and mobile export pipeline for WasteSort"
authors = ["WasteSort Contributors"]
readme = "README.md"
packages = [{include = "wastesort_ml", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
torch = "^2.2.0"
torchvision = "^0.17.0"
numpy = "^1.24.3"
scikit-learn = "^1.4.0"
albumentations = "^1.4.0"
pillow = "^10.2.0"
opencv-python-headless = "^4.9.0.80"
tqdm = "^4.66.1"
onnx = "^1.15.0"
tensorflow = "^2.15.0"
tf-keras = "^2.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
