[tool.poetry]
name = "wastesort-ml"
version = "0.1.0"
description = "Machine learning training, calibration, and mobile export pipeline for WasteSort"
authors = ["WasteSort Contributors"]
readme = "README.md"
packages = [{include = "wastesort_ml", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.2.0"
torchvision = "^0.17.0"
numpy = "^1.24.3"
scikit-learn = "^1.4.0"
albumentations = "^1.4.0"
pillow = "^10.2.0"
opencv-python-headless = "^4.9.0.80"
tqdm = "^4.66.1"
onnx = "^1.15.0"
tensorflow = "^2.15.0"
tf-keras = "^2.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.2.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
